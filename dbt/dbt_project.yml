name: dvf_entrepot
version: "1.0.0"
config-version: 2

profile: dvf_entrepot

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Règles de gestion exposées ici plutôt que cachées dans le SQL : un
  # relecteur voit immédiatement ce qui a été filtré, et peut le changer
  # sans toucher aux modèles.
  #   dbt build --vars '{"prix_m2_max": 15000}'
  surface_bati_min: 9
  prix_m2_min: 300
  prix_m2_max: 20000

models:
  dvf_entrepot:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
